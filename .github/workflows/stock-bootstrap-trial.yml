name: stock-bootstrap-trial

on:
  pull_request:
    paths:
      - 'receipt_stock/**'
      - 'collector/**'
      - 'common/**'
      - 'receipt_graft/**'
      - 'receipt_cli/**'
      - 'pyproject.toml'
      - 'tests/test_stock_bootstrap.py'
      - 'tests/test_stock_build.py'
      - 'tests/test_stock_coverage.py'
      - 'tests/test_stock_mount.py'
      - 'tests/test_github_file_spec.py'
      - '.github/workflows/stock-bootstrap-trial.yml'
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Receipt
        run: python -m pip install -e '.[dev]'
      - name: Bootstrap pinned curated stock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/receipt-stock-bootstrap
          receipt stock bootstrap -o /tmp/receipt-stock-bootstrap
      - name: Verify inventory, mounts, dependency coverage and discovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from receipt_stock.build import plan_stock
          from receipt_stock.query import find_units

          root = Path('/tmp/receipt-stock-bootstrap')
          data = json.loads((root / 'stock-index.v1.json').read_text())
          units = json.loads((root / 'stock-units.v1.json').read_text())
          coverage = json.loads((root / 'stock-coverage.v1.json').read_text())
          assert data['schema'] == 'receipt.stock.index.v1'
          assert units['schema'] == 'receipt.stock.units.v1'
          assert coverage['schema'] == 'receipt.stock.coverage.v1'
          assert len(data['sources']) == 24
          assert data['totals']['files'] == units['counts']['units']
          assert data['unit_index']['units'] == units['counts']['units']
          assert data['unit_index']['fingerprint'] == units['fingerprint']
          assert data['coverage']['fingerprint'] == coverage['fingerprint']
          assert coverage['stock_unit_index_fingerprint'] == units['fingerprint']
          assert data['totals']['files'] > 2613
          assert data['totals']['accepted'] + data['totals']['constrained'] > 0
          assert data['totals']['rejected'] == 0
          assert data['fingerprint']
          required = {
              'cli', 'http-client', 'network', 'data-modeling', 'web-api',
              'web-runtime', 'asgi', 'async-networking', 'async-runtime',
              'concurrency', 'transport', 'connection-pooling', 'http2',
              'database', 'orm', 'scheduling', 'observability',
              'ai-client', 'tool-interfaces', 'typing', 'type-hints',
              'runtime-introspection', 'constraints', 'validation-core',
              'documentation-metadata', 'websocket', 'idna', 'tls'
          }
          assert required <= set(data['capability_tags'])
          for source in data['sources']:
              assert source['stock_graph_fingerprint']
              assert source['mount']
              assert source['mount_kind'] in {'package', 'module'}
              assert Path(source['catalog'], 'receipts.json').is_file()
              assert Path(source['catalog'], 'admission.v1.json').is_file()

          joins = {
              (row['consumer_source'], row['provider_source'], row['package'])
              for row in coverage['latent_stock_joins']
          }
          assert ('fastapi-web', 'pydantic-models', 'pydantic') in joins
          assert ('fastapi-web', 'starlette-web-runtime', 'starlette') in joins
          assert ('starlette-web-runtime', 'anyio-runtime', 'anyio') in joins
          assert ('openai-sdk', 'httpx2-client', 'httpx2') in joins
          assert ('pydantic-models', 'typing-extensions', 'typing_extensions') in joins
          assert ('pydantic-models', 'typing-inspection', 'typing_inspection') in joins
          assert ('pydantic-models', 'annotated-types', 'annotated_types') in joins
          assert ('pydantic-models', 'pydantic-core-runtime', 'pydantic_core') in joins
          assert ('fastapi-web', 'annotated-doc', 'annotated_doc') in joins
          assert ('openai-sdk', 'websockets-runtime', 'websockets') in joins
          assert ('openai-sdk', 'sniffio-runtime', 'sniffio') in joins
          assert ('requests-core', 'idna-runtime', 'idna') in joins
          assert ('requests-core', 'urllib3-runtime', 'urllib3') in joins

          uncovered = {row['package'] for row in coverage['uncovered_external_packages']}
          for package in {
              'typing_extensions', 'typing_inspection', 'annotated_types',
              'pydantic_core', 'annotated_doc', 'websockets', 'sniffio',
              'idna', 'urllib3'
          }:
              assert package not in uncovered
          assert coverage['totals']['latent_stock_joins'] > 35
          assert coverage['totals']['uncovered_external_references'] < 229
          assert coverage['authority']['asserts_api_compatibility'] is False
          assert coverage['authority']['asserts_license_compatibility'] is False

          typing_unit = next(unit for unit in units['units'] if unit['source_id'] == 'typing-extensions')
          assert typing_unit['mount'] == 'typing_extensions'
          assert typing_unit['mount_kind'] == 'module'
          assert typing_unit['rel'] == 'typing_extensions.py'
          assert typing_unit['source_identity']['path'] == 'src/typing_extensions.py'

          click = next(unit for unit in units['units'] if unit['source_id'] == 'click-core' and unit['rel'] == 'click/core.py')
          click_plan = plan_stock(root, [click['id']])['plan']
          assert click_plan['count'] > 1
          assert click_plan['missing_local'] == []
          assert click_plan['ambiguous_local'] == []

          print(json.dumps(data['totals'], indent=2))
          print(json.dumps(coverage['totals'], indent=2))
          print('TOP_UNCOVERED_STOCK_GAPS')
          print(json.dumps(coverage['uncovered_external_packages'][:25], indent=2))
          PY
